apiVersion: v1
kind: ConfigMap
metadata:
  name: task-app-config
  namespace: default
data:
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"

---
apiVersion: v1
kind: Secret
metadata:
  name: task-db-secret
  namespace: default
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: taskuser
  SPRING_DATASOURCE_PASSWORD: taskpass123
  MYSQL_ROOT_PASSWORD: root123

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-app
  template:
    metadata:
      labels:
        app: task-app
    spec:
      containers:
      - name: task-app
        image: ghcr.io/YOUR_USERNAME/architecture-customer-demo:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://task-mysql:3306/task_db"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: task-db-secret
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: task-db-secret
              key: SPRING_DATASOURCE_PASSWORD
        envFrom:
        - configMapRef:
            name: task-app-config
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: task-app
  namespace: default
spec:
  selector:
    app: task-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-mysql
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-mysql
  template:
    metadata:
      labels:
        app: task-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: task-db-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          value: "task_db"
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: task-db-secret
              key: SPRING_DATASOURCE_USERNAME
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: task-db-secret
              key: SPRING_DATASOURCE_PASSWORD
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: mysql-storage
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: task-mysql
  namespace: default
spec:
  selector:
    app: task-mysql
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306
  type: ClusterIP
